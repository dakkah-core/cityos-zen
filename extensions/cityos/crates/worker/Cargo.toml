[package]
name = "cityos-zen-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cityos-zen-contracts.workspace = true
cityos-zen-admission.workspace = true
cityos-zen-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", default-features = false, features = ["fs", "signal", "process", "resource", "sched", "user"] }
rustix = { version = "=1.1.5", features = ["fs", "thread"] }

[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64", target_arch = "riscv64")))'.dependencies]
landlock = "=0.4.4"
seccompiler = "=0.5.0"

[lints]
workspace = true
